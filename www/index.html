<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GigBounty Studio · Stars Escrow</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: #0b1220; --card: #131c31; --border: rgba(148,163,184,.18); --text: #f1f5f9; --muted: #94a3b8; --blue: #3b82f6; --gold: #f59e0b; --green: #10b981; --red: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px 12px 84px; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; }
    .brand { font-size: 16px; font-weight: 800; color: #38bdf8; }
    .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .h-right { display: flex; align-items: center; gap: 6px; }
    .lang-btn { background: rgba(255,255,255,.08); color: #cbd5e1; border: 1px solid var(--border); padding: 5px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .bal { background: rgba(245,158,11,.15); color: #fbbf24; border: 1px solid rgba(245,158,11,.35); padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .title { font-size: 15px; font-weight: 700; line-height: 1.35; }
    .desc { font-size: 13px; color: var(--muted); margin: 8px 0; line-height: 1.5; white-space: pre-wrap; }
    .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(59,130,246,.15); color: #60a5fa; white-space: nowrap; }
    .tag.escrow { background: rgba(16,185,129,.15); color: #34d399; }
    .tag.gold { background: rgba(245,158,11,.15); color: #fbbf24; font-weight: 700; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff; margin-top: 8px; }
    .btn-row .btn { margin-top: 0; }
    .btn.gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #111827; }
    .btn.green { background: var(--green); color: #06281e; }
    .btn.ghost { background: rgba(255,255,255,.08); color: #cbd5e1; }
    .btn.danger { background: rgba(239,68,68,.18); color: #fca5a5; border: 1px solid rgba(239,68,68,.35); }
    .btn:disabled { opacity: .5; }
    input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #090f1c; color: var(--text); font-size: 14px; margin-top: 6px; margin-bottom: 10px; }
    label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .tabs { position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(11,18,32,.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding: 8px 4px 12px; z-index: 50; }
    .tab { text-align: center; font-size: 11px; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .tab.active { color: #38bdf8; font-weight: 700; }
    .tab span { font-size: 18px; }
    .empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 13px; }
    .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px; border: 1px solid var(--border); z-index: 99; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
    .view { display: none; } .view.active { display: block; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="header">
    <div>
      <div class="brand">⚡ GigBounty Studio</div>
      <div id="userSub" class="sub"></div>
    </div>
    <div class="h-right">
      <button id="langBtn" class="lang-btn" onclick="toggleLang()">EN</button>
      <div id="balBadge" class="bal">⭐ 0</div>
    </div>
  </div>

  <div id="v-hall" class="view active">
    <div class="row" style="margin-bottom:10px;"><select id="catFilter" onchange="renderAll()" style="margin:0;"></select></div>
    <div id="hallList"></div>
  </div>

  <div id="v-pub" class="view">
    <div class="card">
      <div id="t-pubTitle" class="title" style="margin-bottom:10px;"></div>
      <label id="l-title"></label><input id="pTitle" />
      <label id="l-cat"></label><select id="pCat"></select>
      <label id="l-bounty"></label><input id="pBounty" type="number" min="1" value="100" />
      <label id="l-desc"></label><textarea id="pDesc" rows="4"></textarea>
      <div id="t-escrowNote" style="font-size:12px;color:#94a3b8;margin-bottom:6px;"></div>
      <button id="pubBtn" class="btn gold" onclick="publishTask(false)"></button>
      <button id="pubBalBtn" class="btn ghost" onclick="publishTask(true)" style="display:none;"></button>
    </div>
  </div>

  <div id="v-orders" class="view"><div id="orderList"></div></div>

  <div id="v-wallet" class="view">
    <div class="card">
      <div id="t-balLabel" class="sub"></div>
      <div id="walletBal" style="font-size:28px;font-weight:800;color:#fbbf24;margin:6px 0;">⭐ 0</div>
      <div id="t-feeNote" class="sub"></div>
    </div>
    <div class="card">
      <div id="t-wTitle" class="title" style="margin-bottom:10px;"></div>
      <label id="l-wAmt"></label><input id="wAmt" type="number" min="100" />
      <label id="l-wAddr"></label><input id="wAddr" />
      <button id="wBtn" class="btn" onclick="applyWithdraw()"></button>
    </div>
    <div id="withdrawList"></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="go('hall', this)"><span>🔥</span><b id="tab-hall"></b></div>
    <div class="tab" onclick="go('pub', this)"><span>➕</span><b id="tab-pub"></b></div>
    <div class="tab" onclick="go('orders', this)"><span>📋</span><b id="tab-orders"></b></div>
    <div class="tab" onclick="go('wallet', this)"><span>💰</span><b id="tab-wallet"></b></div>
  </div>

  <script>
    const API = "https://gig-bounty-api.zhangbanzhuan.workers.dev";
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const tgUser = tg?.initDataUnsafe?.user || { id: "", first_name: "Guest", language_code: "zh" };
    const ME = { id: String(tgUser.id || ""), name: [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ") || "TG User" };

    const CATS = [
      { v: "开发/技术", zh: "开发/技术", en: "Dev / Tech" },
      { v: "设计/视频", zh: "设计/视频", en: "Design / Video" },
      { v: "推广/运营", zh: "推广/运营", en: "Marketing / Ops" },
      { v: "其他零工", zh: "其他零工", en: "Other Gigs" }
    ];

    const I18N = {
      zh: {
        langBtn: "EN", account: "当前账号：", allCat: "全部分类",
        tabHall: "大厅", tabPub: "发单", tabOrders: "订单", tabWallet: "钱包",
        pubTitle: "➕ 发布 Stars 托管悬赏", lTitle: "任务标题", pTitle: "例：帮我设计一套 Telegram 频道头像与横幅",
        lCat: "任务分类", lBounty: "悬赏金额（Telegram Stars ⭐）", pBounty: "输入托管 Stars 数量",
        lDesc: "需求描述与验收标准", pDesc: "写明具体交付物与截止时间...",
        escrowNote: "🛡️ 支付后由平台中间托管，验收后自动发放 80% 给接单人（未接单可随时退回）。",
        pubBtn: "⭐ 支付 Stars 并托管发布", pubBalBtn: (b) => `💰 使用平台余额直接发布（当前 ⭐ ${b}）`,
        balLabel: "可提现 Stars 余额", feeNote: "平台收取 20% 托管服务费，最低 100 Stars 起提。",
        wTitle: "💸 申请提现结算", lWAmt: "提现数量（Stars）", pWAmt: "至少 100",
        lWAddr: "TON 链收款地址（仅支持 TON 网络）", pWAddr: "输入 UQ / EQ 开头的 TON 钱包地址", wBtn: "提交提现申请",
        escrowTag: "🛡️ 平台已托管", noDesc: "暂无详细说明", employer: "雇主：",
        refundBtn: "取消并退款", claimBtn: (n) => `立即接单（验收得 ⭐ ${n}）`,
        emptyHall: "暂无待接悬赏，点击下方「➕ 发单」发布第一个 Stars 悬赏吧！", emptyOrders: "还没有相关订单",
        myPost: "我发布的", myClaim: "我接的单", deliverNote: "📦 交付说明：",
        deliverBtn: "📦 提交交付成果", approveBtn: "✅ 确认验收并放款",
        chatBtn: "💬 私聊对方", releaseBtn: "⏱ 超时释放(48h)", disputeBtn: "⚖️ 申请仲裁",
        addrLabel: "地址：",
        status: { OPEN: "🟢 待接单", IN_PROGRESS: "🟡 进行中", DELIVERED: "🟣 待验收", COMPLETED: "✅ 已结算", REFUNDED: "↩️ 已退款", DISPUTED: "⚖️ 仲裁中" },
        paidOk: "✅ 发布成功，悬赏已托管上架！", payCancel: "已取消支付",
        claimOk: "🤝 接单成功！请前往「订单」交付", deliverPrompt: "请输入交付链接或说明：",
        deliverOk: "📦 已提交交付，等待雇主验收", approveConfirm: "确认验收并放款给接单人？",
        approveOk: (n) => `✅ 已放款 ${n} Stars 给接单人！`, refundConfirm: "确认取消悬赏并退回 Stars？",
        refundOk: "↩️ Stars 已退回！", releaseConfirm: "确认将超过 48 小时未交付的任务重新释放回大厅？",
        releaseOk: "⏱ 任务已释放回大厅", disputePrompt: "请简述仲裁理由（将直接推送给平台管理员）：",
        disputeOk: "⚖️ 已提交平台仲裁，请等待管理员裁决", withdrawOk: "💸 提现申请已提交，等待平台打款"
      },
      en: {
        langBtn: "中文", account: "Account: ", allCat: "All Categories",
        tabHall: "Hall", tabPub: "Post", tabOrders: "Orders", tabWallet: "Wallet",
        pubTitle: "➕ Post Stars Escrow Bounty", lTitle: "Task Title", pTitle: "e.g., Design a Telegram channel avatar & banner",
        lCat: "Category", lBounty: "Bounty Amount (Telegram Stars ⭐)", pBounty: "Enter Stars amount",
        lDesc: "Requirements & Acceptance Criteria", pDesc: "Describe deliverables and deadline...",
        escrowNote: "🛡️ Held in platform escrow. 80% released to worker upon approval (full refund if unclaimed).",
        pubBtn: "⭐ Pay Stars & Post Bounty", pubBalBtn: (b) => `💰 Post with Balance (Avail ⭐ ${b})`,
        balLabel: "Withdrawable Stars Balance", feeNote: "20% platform escrow fee. Minimum withdrawal: 100 Stars.",
        wTitle: "💸 Request Withdrawal", lWAmt: "Amount (Stars)", pWAmt: "Min 100",
        lWAddr: "TON Wallet Address (TON Network Only)", pWAddr: "Enter UQ / EQ TON wallet address", wBtn: "Submit Withdrawal",
        escrowTag: "🛡️ Escrowed", noDesc: "No description provided", employer: "Employer: ",
        refundBtn: "Cancel & Refund", claimBtn: (n) => `Claim Task (Earn ⭐ ${n})`,
        emptyHall: "No open bounties yet. Tap '➕ Post' below to create the first one!", emptyOrders: "No orders yet",
        myPost: "Posted", myClaim: "Claimed", deliverNote: "📦 Delivery: ",
        deliverBtn: "📦 Submit Delivery", approveBtn: "✅ Approve & Pay",
        chatBtn: "💬 Message", releaseBtn: "⏱ Release (48h)", disputeBtn: "⚖️ Dispute",
        addrLabel: "Address: ",
        status: { OPEN: "🟢 Open", IN_PROGRESS: "🟡 In Progress", DELIVERED: "🟣 Delivered", COMPLETED: "✅ Completed", REFUNDED: "↩️ Refunded", DISPUTED: "⚖️ Disputed" },
        paidOk: "✅ Bounty is now live in escrow!", payCancel: "Payment cancelled",
        claimOk: "🤝 Claimed! Go to 'Orders' to submit delivery.", deliverPrompt: "Enter delivery link or notes:",
        deliverOk: "📦 Delivery submitted, awaiting approval.", approveConfirm: "Approve delivery and release Stars?",
        approveOk: (n) => `✅ Released ${n} Stars to worker!`, refundConfirm: "Cancel bounty and refund Stars?",
        refundOk: "↩️ Stars refunded!", releaseConfirm: "Release this stalled (>48h) task back to the hall?",
        releaseOk: "⏱ Task released back to hall", disputePrompt: "Enter dispute reason for platform admin:",
        disputeOk: "⚖️ Dispute submitted to admin", withdrawOk: "💸 Withdrawal submitted, awaiting payout."
      }
    };

    let LANG = localStorage.getItem("gig_lang") || ((tgUser.language_code || "").toLowerCase().startsWith("zh") ? "zh" : "en");
    let STATE = { user: { balance: 0 }, tasks: [], withdrawals: [], feeRate: 0.2 };
    const t = () => I18N[LANG];
    const catLabel = (v) => (CATS.find(c => c.v === v) || {})[LANG] || v;

    async function apiFetch(path, opts = {}) {
      const headers = { "Content-Type": "application/json", "X-TG-Init-Data": tg?.initData || "", ...(opts.headers || {}) };
      return fetch(API + path, { ...opts, headers }).then(r => r.json());
    }

    function openChat(username) {
      if (!username) return;
      const url = "https://t.me/" + username;
      tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, "_blank");
    }

    function toggleLang() { LANG = LANG === "zh" ? "en" : "zh"; localStorage.setItem("gig_lang", LANG); applyStaticText(); renderAll(); }

    function applyStaticText() {
      const L = t();
      document.getElementById("langBtn").textContent = L.langBtn;
      document.getElementById("tab-hall").textContent = L.tabHall;
      document.getElementById("tab-pub").textContent = L.tabPub;
      document.getElementById("tab-orders").textContent = L.tabOrders;
      document.getElementById("tab-wallet").textContent = L.tabWallet;
      document.getElementById("t-pubTitle").textContent = L.pubTitle;
      document.getElementById("l-title").textContent = L.lTitle;
      document.getElementById("pTitle").placeholder = L.pTitle;
      document.getElementById("l-cat").textContent = L.lCat;
      document.getElementById("l-bounty").textContent = L.lBounty;
      document.getElementById("pBounty").placeholder = L.pBounty;
      document.getElementById("l-desc").textContent = L.lDesc;
      document.getElementById("pDesc").placeholder = L.pDesc;
      document.getElementById("t-escrowNote").textContent = L.escrowNote;
      document.getElementById("pubBtn").textContent = L.pubBtn;
      document.getElementById("t-balLabel").textContent = L.balLabel;
      document.getElementById("t-feeNote").textContent = L.feeNote;
      document.getElementById("t-wTitle").textContent = L.wTitle;
      document.getElementById("l-wAmt").textContent = L.lWAmt;
      document.getElementById("wAmt").placeholder = L.pWAmt;
      document.getElementById("l-wAddr").textContent = L.lWAddr;
      document.getElementById("wAddr").placeholder = L.pWAddr;
      document.getElementById("wBtn").textContent = L.wBtn;

      const curFilter = document.getElementById("catFilter").value;
      document.getElementById("catFilter").innerHTML = `<option value="">${L.allCat}</option>` + CATS.map(c => `<option value="${c.v}">${c[LANG]}</option>`).join("");
      document.getElementById("catFilter").value = curFilter;
      const curCat = document.getElementById("pCat").value || CATS[0].v;
      document.getElementById("pCat").innerHTML = CATS.map(c => `<option value="${c.v}">${c[LANG]}</option>`).join("");
      document.getElementById("pCat").value = curCat;
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg; el.style.display = "block";
      setTimeout(() => el.style.display = "none", 2600);
    }

    function go(name, el) {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById("v-" + name).classList.add("active");
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      el.classList.add("active");
    }

    async function loadData() {
      const res = await apiFetch("/api/bootstrap");
      if (res.ok) { STATE = res; renderAll(); } else { toast("❌ " + res.error); }
    }

    function renderAll() {
      const L = t();
      const bal = STATE.user?.balance || 0;
      document.getElementById("userSub").textContent = L.account + ME.name;
      document.getElementById("balBadge").textContent = `⭐ ${bal}`;
      document.getElementById("walletBal").textContent = `⭐ ${bal}`;

      const balBtn = document.getElementById("pubBalBtn");
      balBtn.style.display = bal > 0 ? "block" : "none";
      balBtn.textContent = L.pubBalBtn(bal);

      const cat = document.getElementById("catFilter").value;
      const openTasks = STATE.tasks.filter(x => x.status === "OPEN" && (!cat || x.category === cat));
      document.getElementById("hallList").innerHTML = openTasks.length ? openTasks.map(x => `
        <div class="card">
          <div class="row">
            <span class="tag">${catLabel(x.category)}</span>
            <span class="tag escrow">${L.escrowTag}</span>
            <span class="tag gold">⭐ ${x.bounty_stars}</span>
          </div>
          <div class="title" style="margin-top:8px;">${x.title}</div>
          <div class="desc">${x.description || L.noDesc}</div>
          <div class="row"><div class="sub">${L.employer}${x.employer_name}</div>
            ${x.employer_username && String(x.employer_id) !== ME.id ? `<button class="lang-btn" onclick="openChat('${x.employer_username}')">${L.chatBtn}</button>` : ""}
          </div>
          ${String(x.employer_id) === ME.id
            ? `<button class="btn ghost" onclick="refundTask('${x.id}')">${L.refundBtn}</button>`
            : `<button class="btn" onclick="claimTask('${x.id}')">${L.claimBtn(Math.floor(x.bounty_stars * (1 - STATE.feeRate)))}</button>`}
        </div>
      `).join("") : `<div class="empty">${L.emptyHall}</div>`;

      const myTasks = STATE.tasks.filter(x => String(x.employer_id) === ME.id || String(x.worker_id) === ME.id);
      document.getElementById("orderList").innerHTML = myTasks.length ? myTasks.map(x => {
        const isEmp = String(x.employer_id) === ME.id;
        const peerUser = isEmp ? x.worker_username : x.employer_username;
        let acts = [];
        if (!isEmp && x.status === "IN_PROGRESS") acts.push(`<button class="btn" onclick="deliverTask('${x.id}')">${L.deliverBtn}</button>`);
        if (isEmp && x.status === "DELIVERED") acts.push(`<button class="btn green" onclick="approveTask('${x.id}')">${L.approveBtn}</button>`);
        if (isEmp && x.status === "OPEN") acts.push(`<button class="btn ghost" onclick="refundTask('${x.id}')">↩️ ${L.refundBtn}</button>`);
        if (isEmp && x.status === "IN_PROGRESS") acts.push(`<button class="btn ghost" onclick="releaseTask('${x.id}')">${L.releaseBtn}</button>`);
        if (["IN_PROGRESS", "DELIVERED"].includes(x.status)) acts.push(`<button class="btn danger" onclick="disputeTask('${x.id}')">${L.disputeBtn}</button>`);
        return `
          <div class="card">
            <div class="row">
              <span class="tag">${isEmp ? L.myPost : L.myClaim}</span>
              <span class="tag gold">⭐ ${x.bounty_stars}</span>
              <span class="sub">${L.status[x.status] || x.status}</span>
            </div>
            <div class="title" style="margin-top:8px;">${x.title}</div>
            ${peerUser ? `<div style="margin-top:6px;"><button class="lang-btn" onclick="openChat('${peerUser}')">${L.chatBtn} @${peerUser}</button></div>` : ""}
            ${x.deliver_note ? `<div class="desc" style="color:#a7f3d0;">${L.deliverNote}${x.deliver_note}</div>` : ""}
            ${acts.length ? `<div class="btn-row">${acts.join("")}</div>` : ""}
          </div>`;
      }).join("") : `<div class="empty">${L.emptyOrders}</div>`;

      document.getElementById("withdrawList").innerHTML = STATE.withdrawals.map(w => `
        <div class="card">
          <div class="row"><b>⭐ ${w.amount_stars} Stars</b><span class="tag">${w.status}</span></div>
          <div class="sub" style="margin-top:6px;">${L.addrLabel}${w.payout_address}</div>
        </div>
      `).join("");
    }

    async function publishTask(useBalance) {
      const res = await apiFetch("/api/tasks/create-invoice", {
        method: "POST",
        body: JSON.stringify({
          title: document.getElementById("pTitle").value,
          category: document.getElementById("pCat").value,
          bounty_stars: Number(document.getElementById("pBounty").value),
          description: document.getElementById("pDesc").value,
          pay_with_balance: useBalance
        })
      });
      if (!res.ok) return toast("❌ " + res.error);
      if (res.paidByBalance) {
        toast(t().paidOk);
        document.getElementById("pTitle").value = ""; document.getElementById("pDesc").value = "";
        return loadData();
      }
      if (tg?.openInvoice) {
        tg.openInvoice(res.invoiceUrl, (status) => {
          if (status === "paid") {
            toast(t().paidOk);
            document.getElementById("pTitle").value = ""; document.getElementById("pDesc").value = "";
            setTimeout(loadData, 1200);
          } else if (status === "cancelled") toast(t().payCancel);
        });
      } else window.open(res.invoiceUrl, "_blank");
    }

    async function claimTask(id) {
      const r = await apiFetch("/api/tasks/claim", { method: "POST", body: JSON.stringify({ task_id: id }) });
      toast(r.ok ? t().claimOk : "❌ " + r.error); loadData();
    }
    async function releaseTask(id) {
      if (!confirm(t().releaseConfirm)) return;
      const r = await apiFetch("/api/tasks/release", { method: "POST", body: JSON.stringify({ task_id: id }) });
      toast(r.ok ? t().releaseOk : "❌ " + r.error); loadData();
    }
    async function deliverTask(id) {
      const note = prompt(t().deliverPrompt); if (note === null) return;
      const r = await apiFetch("/api/tasks/deliver", { method: "POST", body: JSON.stringify({ task_id: id, note }) });
      toast(r.ok ? t().deliverOk : "❌ " + r.error); loadData();
    }
    async function approveTask(id) {
      if (!confirm(t().approveConfirm)) return;
      const r = await apiFetch("/api/tasks/approve", { method: "POST", body: JSON.stringify({ task_id: id }) });
      toast(r.ok ? t().approveOk(r.netStars) : "❌ " + r.error); loadData();
    }
    async function disputeTask(id) {
      const reason = prompt(t().disputePrompt); if (reason === null) return;
      const r = await apiFetch("/api/tasks/dispute", { method: "POST", body: JSON.stringify({ task_id: id, reason }) });
      toast(r.ok ? t().disputeOk : "❌ " + r.error); loadData();
    }
    async function refundTask(id) {
      if (!confirm(t().refundConfirm)) return;
      const r = await apiFetch("/api/tasks/refund", { method: "POST", body: JSON.stringify({ task_id: id }) });
      toast(r.ok ? t().refundOk : "❌ " + r.error); loadData();
    }
    async function applyWithdraw() {
      const r = await apiFetch("/api/withdraw", {
        method: "POST",
        body: JSON.stringify({ amount_stars: Number(document.getElementById("wAmt").value), address: document.getElementById("wAddr").value })
      });
      toast(r.ok ? t().withdrawOk : "❌ " + r.error);
      if (r.ok) { document.getElementById("wAmt").value = ""; loadData(); }
    }

    applyStaticText();
    loadData();
  </script>
</body>
</html>
